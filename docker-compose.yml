services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: vizuai
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: vizuai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vizuai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

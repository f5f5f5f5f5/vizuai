server {
  listen 8080;
  server_name app.vizuai.example;

  root /usr/share/nginx/html;
  index spa.html;

  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /spa.html =404;
  }

  location = /spa.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|ico|json|txt|webmanifest|map)$ {
    try_files $uri =404;
  }

  location = /robots.txt {
    add_header Content-Type text/plain always;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location / {
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter '<title>VizuAI</title>' '<title>VizuAI App</title>';
    sub_filter '</head>' '<meta name="description" content="Приложение VizuAI для дизайна интерьера по фото, сценария по референсу и поиска мебели."><meta name="robots" content="noindex,nofollow,noarchive"><meta property="og:title" content="VizuAI App"><meta property="og:description" content="Приложение VizuAI для дизайна интерьера по фото, сценария по референсу и поиска мебели."><meta property="og:type" content="website"></head>';
    try_files $uri $uri/ /spa.html;
  }

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok";
  }
}

server {
  listen 8080;
  server_name vizuai.example www.vizuai.example;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /spa.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|ico|json|txt|webmanifest|map)$ {
    try_files $uri =404;
  }

  location ~ ^/(login|auth/login|app)(/|$) {
    return 308 https://app.vizuai.example$request_uri;
  }

  location = /robots.txt {
    try_files /robots.txt =404;
  }

  location / {
    try_files $uri/index.html $uri $uri/ /spa.html;
  }

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 "ok";
  }
}

